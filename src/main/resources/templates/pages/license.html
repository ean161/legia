<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <th:block th:replace="~{layout/base :: layout(~{::content}, 'License')}">
        <th:block th:fragment="content">
            <div class="col-span-5 border-l border-border lg:col-span-4">
                <div class="px-8 py-6">
                    <div class="flex-1">
                        <ul id="component-nav" class="uk-switcher max-w-1xl">
                            <li class="uk-active" id="uk-switcher-2" role="tabpanel" aria-labelledby="uk-switcher-1">
                                <div class="flex items-center justify-between">
                                    <div class="space-y-1">
                                        <h2 class="text-2xl font-semibold tracking-tight">Ean</h2>
                                        <p class="text-sm text-muted-foreground">
                                            Phân quyền
                                        </p>
                                    </div>
                                    <div class="space-x-1">
                                        <button class="uk-button uk-button-primary" id="add-license-btn">
                                            Khởi tạo
                                        </button>
                                    </div>
                                </div>
                                <div class="bg-border my-4 h-[1px] w-full"></div>
                                <div>
                                    <table id="list" class="table cell-border hover">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Tài khoản</th>
                                                <th>Khoá quyền</th>
                                                <th>Hiển thị</th>
                                                <th>Ghi chú</th>
                                                <th>Hạn dùng</th>
                                                <th>Ngày tạo</th>
                                                <th>Thao tác</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div id="add-license" class="uk-flex-top" data-uk-modal>
                <div class="uk-modal-dialog uk-margin-auto-vertical">
                    <div class="uk-modal-header">
                        <h2 class="uk-modal-title">Tạo phân quyền</h2>
                    </div>
                    <div class="uk-modal-body space-y-4">
                        <div class="space-y-2">
                            <label class="uk-form-label" for="username">Tài khoản</label>
                            <div class="uk-form-controls">
                                <select class="uk-select" id="id">
                                    <option th:each="user : ${userList}" th:text="${user.username}" th:value="${user.id}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label" for="directory">Khoá quyền</label>
                            <div class="uk-form-controls">
                                <textarea class="uk-input" id="directory"></textarea>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label" for="title">Hiển thị</label>
                            <div class="uk-form-controls">
                                <input class="uk-input" id="title" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label" for="note">Ghi chú</label>
                            <div class="uk-form-controls">
                                <input class="uk-input" id="note" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label" for="icon">Biểu tượng</label>
                            <div class="uk-form-controls">
                                <input class="uk-input" id="icon" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label block" for="expiredDate">Kết thúc</label>
                            <input class="uk-input" id="expiredDate" type="datetime-local">
                        </div>
                    </div>
                    <div class="uk-modal-footer uk-text-right">
                        <button class="uk-button uk-button-primary" type="button" id="add-license-submit">Xác nhận</button>
                    </div>
                </div>
            </div>
            
            <script src="/assets/js/pages/license.js"></script>
        </th:block>
    </th:block>
</html>
