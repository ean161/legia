<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <th:block th:replace="~{layout/base :: layout(~{::content}, 'Lê Gia')}">
        <th:block th:fragment="content">
            <div class="col-span-5 border-l border-border lg:col-span-4">
                <div class="px-8 py-6">
                    <div class="flex-1">
                        <ul id="component-nav" class="uk-switcher max-w-1xl">
                            <li class="uk-active" id="uk-switcher-2" role="tabpanel" aria-labelledby="uk-switcher-1">
                                <div class="flex items-center justify-between">
                                    <div class="space-y-1">
                                        <h2 class="text-2xl font-semibold tracking-tight">Lê Gia</h2>
                                        <p class="text-sm text-muted-foreground">
                                            Thống kê lương <span id="monthTitle"></span>
                                        </p>
                                    </div>
                                    <div class="space-x-2 space-y-1 inline-flex">
                                        <button class="uk-button uk-button-primary mt-1" id="export-btn">
                                            Tải báo cáo
                                        </button>
                                        <div class="uk-form-controls">
                                            <select class="uk-select" id="smonth">
                                                <option value="">Chọn tháng</option>
                                                <option th:each="month : ${months}" th:text="${month}" th:value="${month}"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="bg-border my-4 h-[1px] w-full"></div>
                                <div>
                                    <table id="list" class="table cell-border hoverz">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Nhân viên</th>
                                                <th>Lương cơ bản</th>
                                                <th>Ngày công</th>
                                                <th>Hành chính</th>
                                                <th>Tăng ca</th>
                                                <th>Cộng lương</th>
                                                <th>Trừ lương</th>
                                                <th>Tổng cộng</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <script src="/assets/js/pages/legia/salary.js"></script>
        </th:block>
    </th:block>
</html>
