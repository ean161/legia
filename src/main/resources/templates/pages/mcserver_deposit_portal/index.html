<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <th:block th:replace="~{layout/base :: layout(~{::content}, 'License')}">
        <th:block th:fragment="content">
            <div class="col-span-5 border-l border-border lg:col-span-4">
                <div class="px-8 py-6">
                    <div class="flex-1">
                        <ul id="component-nav" class="uk-switcher max-w-1xl">
                            <li class="uk-active" id="uk-switcher-2" role="tabpanel" aria-labelledby="uk-switcher-1">
                                <div class="flex items-center justify-between">
                                    <div class="space-y-1">
                                        <h2 class="text-2xl font-semibold tracking-tight">Minecraft</h2>
                                        <p class="text-sm text-muted-foreground">
                                            Cổng nạp cho server Minecraft
                                        </p>
                                    </div>
                                    <div class="space-x-1">
                                        <button class="uk-button uk-button-primary" id="add-server-btn">
                                            Tạo
                                        </button>
                                    </div>
                                </div>
                                <div class="bg-border my-4 h-[1px] w-full"></div>
                                <div>
                                    <table id="list" class="table cell-border hover">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Máy chủ</th>
                                                <th>Thông tin</th>
                                                <th>Banner</th>
                                                <th>Ngày tạo</th>
                                                <th>Thao tác</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div id="save-server" class="uk-flex-top" data-uk-modal>
                <div class="uk-modal-dialog uk-margin-auto-vertical">
                    <div class="uk-modal-header">
                        <h2 class="uk-modal-title" id="save-server-title">Tạo cổng nạp</h2>
                    </div>
                    <div class="uk-modal-body space-y-4">
                        <div class="space-y-2">
                            <label class="uk-form-label" for="title">Tên máy chủ</label>
                            <div class="uk-form-controls">
                                <input class="uk-input" id="title" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label" for="description">Thông tin</label>
                            <div class="uk-form-controls">
                                <input class="uk-input" id="description" />
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="uk-form-label" for="banner">Link banner</label>
                            <div class="uk-form-controls">
                                <input class="uk-input" id="banner" />
                            </div>
                        </div>
                    </div>
                    <div class="uk-modal-footer uk-text-right">
                        <button class="uk-button uk-button-primary" type="button" id="save-server-submit">Xác nhận</button>
                    </div>
                </div>
            </div>
            
            <script src="/assets/js/pages/mcserver_deposit_portal/index.js"></script>
        </th:block>
    </th:block>
</html>
